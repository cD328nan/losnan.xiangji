<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>相机</title>
<style>
/* ===== 基础 ===== */

:root{--st:max(env(safe-area-inset-top),59px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font:15px/1.3 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.tap{transition:transform .15s,opacity .15s;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.tap:active{transform:scale(.88);opacity:.7}
#phone{position:relative;width:100%;height:100%;max-width:430px;max-height:932px;margin:0 auto;background:#000;overflow:hidden}
@media(min-width:600px){#phone{height:min(100%,900px);margin-top:max(0px,calc((100% - 900px)/2));border-radius:44px;box-shadow:0 0 0 8px #1c1c1e}}
/* ===== 状态栏（SVG/CSS 绘制） ===== */
#status{position:absolute;top:0;left:0;right:0;height:59px;display:grid;grid-template-columns:1fr 125px 1fr;align-items:center;z-index:6;pointer-events:none;font-weight:600;font-size:16px}
#status .r{justify-self:center;display:flex;gap:6px;align-items:center}#clk{justify-self:center}
/* ===== 取景器 ===== */
#vf{position:absolute;left:0;right:0;top:calc(var(--st) + 52px);bottom:calc(env(safe-area-inset-bottom) + 190px);border-radius:12px;overflow:hidden;background:#111;touch-action:none}
#vid{width:100%;height:100%;object-fit:cover;transform-origin:center;will-change:transform}
#grid{position:absolute;inset:0;pointer-events:none;display:none;background:
 linear-gradient(#fff5,#fff5) 33.3% 0/1px 100% no-repeat,linear-gradient(#fff5,#fff5) 66.6% 0/1px 100% no-repeat,
 linear-gradient(#fff5,#fff5) 0 33.3%/100% 1px no-repeat,linear-gradient(#fff5,#fff5) 0 66.6%/100% 1px no-repeat}
#focus{position:absolute;width:76px;height:76px;border:1.5px solid #ffd60a;border-radius:4px;opacity:0;pointer-events:none;left:0;top:0;transition:opacity .25s}
#ev{position:absolute;width:2px;height:60px;background:#ffd60a;left:84px;top:8px;display:none}
#zl{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);background:#0008;border-radius:20px;padding:4px 12px;font-weight:600;color:#ffd60a;opacity:0;transition:opacity .3s;pointer-events:none}
#zbtn{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#0006;border-radius:24px;padding:4px}
#zbtn button{width:36px;height:36px;border-radius:50%;font-size:12px;font-weight:600}
#zbtn button.on{background:#0009;color:#ffd60a}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:200;pointer-events:none}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#rec{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;background:#ff3b30;border-radius:6px;padding:2px 10px;font-weight:600;font-variant-numeric:tabular-nums}
/* ===== 顶部控制 ===== */
#top{position:absolute;left:0;right:0;top:var(--st);height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:5}
#top .g{display:flex;gap:2px}
#top .tap.on{color:#ffd60a}
/* ===== 底部 ===== */
#bot{position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 190px);padding-bottom:env(safe-area-inset-bottom)}
#modes{position:relative;height:44px;margin-top:6px;overflow:hidden;touch-action:pan-x}
#mrow{position:absolute;left:50%;top:0;display:flex;gap:6px;transition:transform .3s cubic-bezier(.3,.8,.3,1);will-change:transform}
#mrow button{padding:0 10px;height:44px;font-weight:600;font-size:14px;color:#fff9;white-space:nowrap}
#mrow button.on{color:#ffd60a}
#ctl{display:flex;justify-content:space-around;align-items:center;margin-top:14px}
#thumb{width:56px;height:56px;border-radius:10px;background:#222 center/cover;border:1.5px solid #fff4}
#shut{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;transition:transform .12s}
#shut:active{transform:scale(.92)}
#shut i{width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .2s,border-radius .2s,background .2s}
#shut.vid i{background:#ff3b30}
#shut.rec i{width:34px;height:34px;transform:none;border-radius:8px;background:#ff3b30}
#flip{width:56px;height:56px;border-radius:50%;background:#2c2c2e;transition:transform .4s}
/* ===== 层：图库/设置/查看器 ===== */
.layer{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column;padding-top:var(--st)}
.layer.show{display:flex}
.hd{display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 8px;font-weight:600;font-size:17px}
#gal{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
.day{padding:12px 14px 6px;font-weight:700}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.it{position:relative;aspect-ratio:1;background:#1c1c1e center/cover;transition:transform .15s}
.it:active{transform:scale(.96)}
.it .b{position:absolute;right:4px;bottom:4px;font-size:11px;font-weight:600;text-shadow:0 0 3px #000}
.it .ck{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:none;background:#0006}
.sel .it .ck{display:block}
.it.s .ck{background:#0a84ff;border-color:#0a84ff}
.empty{text-align:center;color:#8e8e93;margin-top:30vh}
#viewer{background:#000;z-index:30}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none}
#stage img,#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;will-change:transform}
#vbar{display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px)}
#info{position:absolute;left:12px;right:12px;bottom:70px;background:#1c1c1ecc;border-radius:12px;padding:12px;font-size:13px;display:none;line-height:1.7}
.row{display:flex;justify-content:space-between;align-items:center;padding:0 16px;min-height:52px;border-bottom:1px solid #2c2c2e}
.sw{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:#2c2c2e;border-radius:8px}
.seg button{padding:5px 12px;border-radius:8px}.seg .on{background:#636366}
#toast{position:absolute;left:50%;top:calc(var(--st) + 50px);transform:translate(-50%,-10px);background:#2c2c2eee;border-radius:14px;padding:10px 16px;opacity:0;transition:opacity .25s,transform .25s;z-index:50;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#perm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#8e8e93;z-index:2;background:#111}

.tap{transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .2s}.tap:active{transition-duration:.1s,.1s}
#vf{transition:clip-path .45s cubic-bezier(.32,.72,0,1)}
.gh{padding:22px 16px 6px;color:#8e8e93;font-size:13px}
.seg button{padding:5px 7px;font-size:12px}
input[type=range]{width:150px;accent-color:#ffd60a;touch-action:pan-y}

#isl{position:absolute;top:11px;left:50%;width:125px;height:37px;margin-left:-62.5px;border-radius:999px;background:#000;z-index:10;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;touch-action:manipulation}
#pv{width:7px;height:7px;border-radius:50%;background:#30D158;opacity:0;transition:opacity .2s ease-out,background-color .2s ease-out}
#pv.cam{opacity:1;background:#30D158}#pv.mic{opacity:1;background:#FF9F0A}
#shut{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}#shut:active{transition-duration:.1s}
#shut i{transition:transform .4s cubic-bezier(.34,1.56,.64,1),border-radius .2s,background .2s}#shut:active i{transform:scale(.86)}
#shut.rec:active i{transform:scale(.9)}
@keyframes blk{50%{opacity:.35}}#rec{animation:blk 1s ease-in-out infinite}
@keyframes mon{from{opacity:.45;transform:scale(.9)}to{opacity:1;transform:none}}#mrow button.on{animation:mon .4s cubic-bezier(.32,.72,0,1)}
#thumb{box-shadow:0 2px 8px #000a,0 0 0 1px #fff2}

/* ===== 录像计时条：独立于取景器（不会被画面比例 clip-path 裁掉），位于顶部控制行下方 ===== */
#rec{display:none!important}
#recbar{position:absolute;left:0;right:0;top:calc(var(--st) + 54px);display:flex;justify-content:center;align-items:center;gap:10px;z-index:7;pointer-events:none;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .45s cubic-bezier(.32,.72,0,1)}
#recbar.on{opacity:1;transform:none}
#recbar button{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:#000a}
#recbar:not(.on) button{pointer-events:none}

#rpill{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;background:#ff3b30;color:#fff;font:600 16px/1 -apple-system,"SF Pro Text",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#rtime{display:inline-block;min-width:4.6ch;text-align:center}
#rdot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blk 1s ease-in-out infinite}
#recbar.pz #rdot{animation:none;opacity:.55}
#recbar.pz #rtime{opacity:.75}

.row{transition:background .2s}.row:active{background:#1c1c1e}

#dlg{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s cubic-bezier(.32,.72,0,1)}
#dlg.show{opacity:1;pointer-events:auto}
#dlg .box{position:relative;width:270px;background:#2c2c2e;border-radius:14px;padding:26px 16px 0;text-align:center;transform:scale(1.12);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#dlg.show .box{transform:none}
#dlg .x{position:absolute;top:0;right:0;color:#8e8e93}
#dlg p{margin:4px 0 20px;line-height:1.5;white-space:pre-line}
#dlg .ok{display:block;width:calc(100% + 32px);margin:0 -16px;height:44px;border-top:1px solid #48484a;color:#ffd60a;font-weight:600;transition:background .2s}
#dlg .ok:active{background:#3a3a3c;border-radius:0 0 14px 14px}

#clk{white-space:nowrap}
#bpct{font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="phone">
  <div id="status"><span id="clk">9:41</span><span></span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" style="fill:#fff;stroke:none"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12"><path d="M1.5 4.2a10 10 0 0 1 14 0M4 7a6.4 6.4 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1" style="fill:#fff"/></svg>
      <span id="bpct">80%</span><svg width="27" height="13" viewBox="0 0 27 13" aria-label="电池"><rect x=".5" y=".5" width="22" height="12" rx="3.5" style="stroke:#fff6;stroke-width:1"/><rect id="bl" x="2" y="2" width="19" height="9" rx="2" style="fill:#fff;stroke:none"/><path d="M24 4.5v4c.9-.3 1.5-1.1 1.5-2s-.6-1.7-1.5-2z" style="fill:#fff6;stroke:none"/><path id="bz" d="M12.5 2.5 8.5 7h3l-1 3.5 4-4.5h-3z" style="fill:#000;stroke:none;display:none"/></svg></span></div>
  <div id="recbar"><div id="rpill"><i id="rdot"></i><span id="rtime">00:00</span></div><button class="tap" id="rpause" aria-label="暂停录制"></button></div>
  <div id="isl" aria-label="灵动岛（界面模拟）"><i id="pv"></i></div>

  <div id="top">
    <div class="g">
      <button class="tap" id="bFlash" aria-label="闪光灯"></button>
      <button class="tap" id="bLive" aria-label="实况照片"></button>
    </div>
    <div class="g">
      <button class="tap" id="bRatio" aria-label="画面比例" style="font-weight:600;font-size:13px"></button><button class="tap" id="bTimer" aria-label="倒计时"></button>
      <button class="tap" id="bSet" aria-label="设置"></button>
    </div>
  </div>

  <div id="vf">
    <video id="vid" playsinline muted autoplay></video>
    <div id="grid"></div><div id="focus"></div><div id="ev"></div>
    <div id="rec">00:00</div><div id="cd"></div><div id="zl">1.0x</div>
    <div id="zbtn"></div><div id="flash"></div>
    <div id="perm">需要相机权限。请在浏览器地址栏或系统设置中允许访问相机与麦克风，并通过 HTTPS 或 localhost 打开本页。</div>
  </div>

  <div id="bot">
    <div id="modes"><div id="mrow"></div></div>
    <div id="ctl">
      <button id="thumb" class="tap" aria-label="图库"></button>
      <button id="shut" aria-label="快门"><i></i></button>
      <button id="flip" class="tap" aria-label="切换镜头"></button>
    </div>
  </div>

  <!-- 图库 -->
  <div class="layer" id="gallery">
    <div class="hd"><button class="tap" id="gBack"></button><span id="gTitle">图库</span><button class="tap" id="gSel" style="min-width:60px">选择</button></div>
    <div id="gal"></div>
    <div id="gBar" class="hd" style="display:none;border-top:1px solid #2c2c2e">
      <button class="tap" id="gAll" style="min-width:60px">全选</button><button class="tap" id="gDl" style="min-width:60px">下载</button><button class="tap" id="gDel" style="min-width:60px;color:#ff453a">删除</button></div>
  </div>

  <!-- 查看器 -->
  <div class="layer" id="viewer">
    <div class="hd"><button class="tap" id="vBack"></button><span id="vTitle"></span><button class="tap" id="vInfo"></button></div>
    <div id="stage"></div><div id="info"></div>
    <div id="vbar"><button class="tap" id="vShare"></button><button class="tap" id="vFav"></button><button class="tap" id="vDl"></button><button class="tap" id="vDel"></button></div>
  </div>

  <!-- 设置 -->
  <div class="layer" id="settings">
    <div class="hd"><span style="width:44px"></span><span>设置</span><button class="tap" id="sDone" style="min-width:60px;color:#ffd60a">完成</button></div>
    <div style="overflow:auto;flex:1" id="sBody"></div>
  </div>
  <div id="dlg"><div class="box" role="dialog" aria-modal="true"><button class="tap x" id="dx" aria-label="关闭"></button><p id="dtxt"></p><button class="ok" id="dok">好</button></div></div>
  <div id="toast"></div>
</div>

<script>
"use strict";
/* ===== 图标（全部手绘 SVG，无 emoji） ===== */
const GEAR=(()=>{const P=[],n=8,r1=7.4,r2=9.8,st=2*Math.PI/n;for(let i=0;i<n;i++){const a=i*st,f=(r,d)=>(12+r*Math.cos(a+d*st)).toFixed(2)+' '+(12+r*Math.sin(a+d*st)).toFixed(2);P.push(f(r1,-.36)+'L'+f(r2,-.2)+'L'+f(r2,.2)+'L'+f(r1,.36))}return '<path d="M'+P.join('L')+'Z"/><circle cx="12" cy="12" r="3.2"/>'})();
const IC={
 flashOff:'<path d="M13 3 5 13h6l-1 8 8-10h-6z"/><path d="M4 4l16 16"/>',
 flashOn:'<path d="M13 3 5 13h6l-1 8 8-10h-6z"/>',
 flashAuto:'<path d="M12 3 4 13h5l-1 8 8-10h-5z"/><path d="M17 5l1.5 4M20 5l-1.5 4M17.6 7.5h2.4"/>',
 live:'<circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9" stroke-dasharray="2 2.5"/>',
 timer:'<circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V9.5M10 3h4"/>',
 gear:GEAR,
 flip:'<path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 share:'<path d="M12 15V3M8 7l4-4 4 4M5 11v9h14v-9"/>',
 heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
 dl:'<path d="M12 3v12M7 11l5 5 5-5M5 20h14"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'
};
const svg=(n,s=26,fill)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"${fill?' style="fill:currentColor"':''}>${IC[n]}</svg>`;
const $=id=>document.getElementById(id);

/* ===== 设置（localStorage） ===== */
const DEF={batPct:true,hour12:true,grid:false,fmt:'jpeg',sound:true,mark:false,loc:false,keep:true,timer:0,snd:true,touch:true,haptic:true,mirror:false,enh:false,q:.95,res:'hd',ratio:'full'};
let S=Object.assign({},DEF,JSON.parse(localStorage.getItem('cam.set')||'{}'));
const saveS=()=>localStorage.setItem('cam.set',JSON.stringify(S));

/* ===== 工具 ===== */
const vib=n=>S.haptic!==false&&navigator.vibrate&&navigator.vibrate(n);
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
const pad=n=>String(n).padStart(2,'0');
/* ===== 状态栏时间 ===== */
let clockTimer=0;
const IS_ZH=(Intl.DateTimeFormat().resolvedOptions().locale||navigator.language||'').toLowerCase().startsWith('zh');
function fmtClock(d){const h=d.getHours(),m=pad(d.getMinutes());if(S.hour12===false)return pad(h)+':'+m;
  return (h%12||12)+':'+m+' '+(IS_ZH?(h<12?'上午':'下午'):(h<12?'AM':'PM'))}
function renderClock(){$('clk').textContent=fmtClock(new Date())}
function clock(){renderClock();clearTimeout(clockTimer);clockTimer=setTimeout(clock,(60-new Date().getSeconds())*1000)}clock();
const lowEnd=(navigator.hardwareConcurrency||4)<=4||(navigator.deviceMemory||4)<=2;

/* ===== IndexedDB ===== */
let db;
const dbReq=(st,mode,fn)=>new Promise((res,rej)=>{const t=db.transaction('m',mode),r=fn(t.objectStore('m'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)});
const dbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('webcam',1);r.onupgradeneeded=()=>r.result.createObjectStore('m',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const dbAll=()=>dbReq('m','readonly',s=>s.getAll());
const dbPut=o=>dbReq('m','readwrite',s=>s.put(o));
const dbDel=id=>dbReq('m','readwrite',s=>s.delete(id));
const dbClear=()=>dbReq('m','readwrite',s=>s.clear());

/* ===== 相机 ===== */
const vid=$('vid');
let stream,track,facing='environment',mode='photo',caps={},zoom=1,hwZoom=false,flashMode='auto',torch=false,recorder,chunks=[],recT0=0,recRaf=0,recTimeout;
const MODES=[['video','视频',1],['photo','照片',1],['portrait','人像',0],['pano','全景',0],['slo','慢动作',0],['lapse','延时摄影',0]];

async function startCam(){
  stopCam();
  const RS={std:[1280,720],hd:[1920,1080],uhd:[3840,2160]},rr=RS[lowEnd&&S.res==='uhd'?'hd':S.res||'hd'],res={width:{ideal:rr[0]},height:{ideal:rr[1]}};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:Object.assign({facingMode:facing},res),audio:false});
  }catch(e){$('perm').style.display='flex';return}
  $('perm').style.display='none';
  vid.srcObject=stream;track=stream.getVideoTracks()[0];
  caps=track.getCapabilities?track.getCapabilities():{};
  hwZoom=!!caps.zoom;zoom=hwZoom?caps.zoom.min:1;
  vid.style.transform=(facing==='user'?'scaleX(-1) ':'')+'scale(1)';
  buildZoom();
  if(flashMode==='on')setTorch(true);
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopCam()}else if(!$('perm').style.display||$('perm').style.display==='none'){startCam()}
});
async function setTorch(on){
  if(caps.torch){try{await track.applyConstraints({advanced:[{torch:on}]});torch=on}catch(e){}}
  else if(on)toast('当前设备或浏览器不支持闪光灯（torch）');
}
function setZoom(z){
  const mn=hwZoom?caps.zoom.min:1,mx=hwZoom?caps.zoom.max:5;
  zoom=Math.max(mn,Math.min(mx,z));
  if(hwZoom)track.applyConstraints({advanced:[{zoom}]}).catch(()=>{});

/* ===== 隐私指示器：与 MediaStreamTrack / MediaRecorder 真实状态绑定 ===== */
function updatePV(){
  const cam=!!(stream&&stream.getVideoTracks().some(t=>t.readyState==='live'&&t.enabled&&!t.muted));
  const mic=!!(recorder&&recorder.state!=='inactive'&&recorder.stream&&recorder.stream.getAudioTracks().some(t=>t.readyState==='live'));
  $('pv').className=cam?'cam':mic?'mic':'';
  $('isl').dataset.t=cam?(mic?'相机和麦克风正在使用':'相机正在使用'):mic?'麦克风正在使用':'相机和麦克风未使用';
}
const _stop=stopCam,_sc2=startCam;
window.stopCam=()=>{_stop();updatePV()};
window.startCam=async()=>{await _sc2();applyRatio();if($('perm').style.display==='flex')SND.p('err');
  if(stream)stream.getTracks().forEach(t=>['ended','mute','unmute'].forEach(e=>t.addEventListener(e,updatePV)));updatePV()};
document.addEventListener('visibilitychange',()=>setTimeout(updatePV,50));

<script>
"use strict";
/* ===== 录像计时器 ===== */
const RT={start:0,total:0,pauseAt:0,raf:0,on:false,txt:'',starting:false};
IC.pause='<rect x="6.5" y="5" width="3.8" height="14" rx="1.5"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.5"/>';
IC.play='<path d="M8 5.8v12.4a1 1 0 0 0 1.5.9l10-6.2a1 1 0 0 0 0-1.7l-10-6.2A1 1 0 0 0 8 5.8z"/>';
function fmtT(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return h>=1?h+':'+pad(m)+':'+pad(s):pad(m)+':'+pad(s)}
function rtFrame(){if(!RT.on)return;const now=performance.now(),ms=(RT.pauseAt||now)-RT.start-RT.total,t=fmtT(Math.max(0,ms)/1000);
  if(t!==RT.txt){RT.txt=t;$('rtime').textContent=t}RT.raf=requestAnimationFrame(rtFrame)}
function rtIcon(p){$('rpause').innerHTML=svg(p?'play':'pause',22,true);$('rpause').setAttribute('aria-label',p?'继续录制':'暂停录制')}
function rtStart(){RT.start=performance.now();RT.total=0;RT.pauseAt=0;RT.txt='';RT.on=true;$('rtime').textContent='00:00';rtIcon(false);
  $('recbar').classList.remove('pz');$('recbar').classList.add('on');cancelAnimationFrame(RT.raf);RT.raf=requestAnimationFrame(rtFrame)}
function rtPause(p){if(!RT.on)return;if(p){RT.pauseAt=performance.now()}else if(RT.pauseAt){const d=performance.now()-RT.pauseAt;RT.total+=d;recT0+=d;RT.pauseAt=0}
  $('recbar').classList.toggle('pz',p);rtIcon(p);SND.p('toggle');vib(8)}
function rtStop(){RT.on=false;RT.pauseAt=0;cancelAnimationFrame(RT.raf);$('recbar').classList.remove('on','pz');RT.txt='';setTimeout(()=>{if(!RT.on)$('rtime').textContent='00:00'},300)}
$('rpause').onclick=()=>{if(!recorder)return;if(recorder.state==='recording')recorder.pause();else if(recorder.state==='paused')recorder.resume()};
rtIcon(false);
const _recBase=toggleRec;
window.toggleRec=()=>{
  if(recorder&&RT.pauseAt){const d=performance.now()-RT.pauseAt;recT0+=d;RT.pauseAt=0}
  if(!recorder&&RT.starting)return Promise.resolve();
  const begin=!recorder;SND.p(begin?'recStart':'recStop');vib(begin?30:[15,40,15]);
  if(begin)RT.starting=true;
  const p=_recBase();
  Promise.resolve(p).finally(()=>{RT.starting=false}).then(()=>{
    updatePV();
    if(begin&&recorder&&recorder.state!=='inactive'&&!RT.on){const r=recorder;rtStart();
      r.addEventListener('pause',()=>rtPause(true));r.addEventListener('resume',()=>rtPause(false));r.addEventListener('stop',rtStop);
      ['start','pause','resume','stop'].forEach(e=>r.addEventListener(e,()=>setTimeout(updatePV,0)))}});
  return p;
};

const LEAF=new Path2D('M15.4 1.8C15.5 3.2 14.8 4.6 13.7 5.4C12.8 6 11.9 6.1 11.4 6C11.3 4.7 11.9 3.4 12.9 2.6C13.6 2.1 14.5 1.8 15.4 1.8Z');
function drawWM(cx,w,h){
